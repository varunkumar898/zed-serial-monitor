[package]
name = "zed-serial-monitor"
version = "0.1.0"
edition = "2021"
description = "Live serial monitor for embedded devices in Zed editor"
license = "MIT"
autobins = false
autoexamples = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.2"

[workspace]
members = [
    ".",
    "crates/cli",
]
default-members = ["."]

