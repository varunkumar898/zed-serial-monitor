name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy linter (WASM Extension)
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: Build WASM Extension
        run: cargo build --target wasm32-wasip2 --release

      - name: Install Linux dependencies for native serialport
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Run Clippy linter (Native CLI)
        run: cargo clippy --package zed-serial-monitor-cli -- -D warnings

      - name: Run Native CLI tests
        run: cargo test --package zed-serial-monitor-cli
